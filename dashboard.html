
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Assistant</title>

    <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            background: linear-gradient(120deg, #101c36, #174a83);
            color: white;
            padding: 24px 5%;
        }

        header h1 {
            font-size: 26px;
        }

        header p {
            color: #cbd5e1;
            margin-top: 7px;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .welcome {
            background: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px #00000008;
        }

        .welcome p {
            color: #64748b;
            margin-top: 7px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .panel, .map-panel {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px #00000008;
        }

        .panel h2, .map-panel h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #2563eb;
            color: white;
            width: 100%;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0 22px;
        }

        .category {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 15px 8px;
            border: 1px solid #dbeafe;
            font-size: 14px;
        }

        .category:hover {
            background: #dbeafe;
        }

        .category span {
            display: block;
            font-size: 25px;
            margin-bottom: 7px;
        }

        #map {
            height: 520px;
            width: 100%;
            border-radius: 12px;
        }

        #message, #results {
            margin-top: 15px;
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
        }

        .result {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
        }

        .result a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .privacy {
            margin-top: 20px;
            padding: 13px;
            background: #eff6ff;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
        }

        .privacy a {
            color: #1d4ed8;
            font-weight: bold;
            cursor: pointer;
        }

        .logout {
            display: inline-block;
            margin: 22px 0;
            color: #2563eb;
            text-decoration: none;
        }

        @media(max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }

            #map {
                height: 380px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📍 Location Assistant</h1>
    <p>Explore places, find destinations and navigate easily.</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome, {{ user["name"] }}!</h2>
        <p>Find your location and explore nearby places.</p>
    </div>

    <div class="layout">

        <div class="panel">

            <h2>📍 My Location</h2>

            <button class="primary" onclick="findLocation()">
                Find My Location
            </button>

            <h2 style="margin-top:25px;">🧭 Find Destination</h2>

            <input
                type="text"
                id="destination"
                placeholder="Enter destination or place name">

            <button class="primary" onclick="findRoute()">
                Get Directions
            </button>

            <h2 style="margin-top:25px;">Explore Nearby</h2>

            <div class="category-grid">

                <button class="category" onclick="findNearby('petrol')">
                    <span>⛽</span>
                    Petrol Pump
                </button>

                <button class="category" onclick="findNearby('food')">
                    <span>🍔</span>
                    Food
                </button>

                <button class="category" onclick="findNearby('hotel')">
                    <span>🏨</span>
                    Hotels
                </button>

                <button class="category" onclick="findNearby('hospital')">
                    <span>🏥</span>
                    Hospitals
                </button>

            </div>

            <div id="message">
                Click Find My Location to begin.
            </div>

            <div id="results"></div>

        </div>

        <div class="map-panel">

            <h2>🗺️ Explore Map</h2>

            <div id="map"></div>

        </div>

    </div>

    
    <a class="logout" href="/logout">Logout</a>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // Map setup
    const map = L.map("map").setView([20.5937, 78.9629], 5);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    let userMarker = null;
    let watchId = null;
    let routeLayer = null;
    let nearbyLayer = L.layerGroup().addTo(map);
    let currentLat = null;
    let currentLng = null;

    const message = document.getElementById("message");
    const results = document.getElementById("results");


    // Get user's location
    function findLocation() {

        if (!navigator.geolocation) {
            message.innerText = "Location is not supported.";
            return;
        }

        message.innerText = "Requesting location permission...";

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
        }

        watchId = navigator.geolocation.watchPosition(

            async function(position) {

                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;

                map.setView([currentLat, currentLng], 16);

                if (userMarker) {
                    userMarker.setLatLng([currentLat, currentLng]);
                } else {
                    userMarker = L.marker([
                        currentLat, currentLng
                    ]).addTo(map);
                }

                userMarker.bindPopup("Your Current Location");

                try {

                    const response = await fetch("/share-location", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            latitude: currentLat,
                            longitude: currentLng
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        message.innerText = data.message;
                        stopSharing();
                        return;
                    }

                    message.innerText =
                        "Your location is visible to Admin. Updated: " +
                        new Date().toLocaleTimeString();

                } catch (error) {
                    message.innerText = "Could not update location.";
                }

            },

            function(error) {
                message.innerText =
                    "Location permission denied or unavailable.";
            },

            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 15000
            }
        );
    }


    // Find destination and route
    async function findRoute() {

        if (currentLat === null) {
            message.innerText = "First click Find My Location.";
            return;
        }

        const place = document.getElementById("destination").value.trim();

        if (!place) {
            message.innerText = "Please enter a destination.";
            return;
        }

        message.innerText = "Searching destination...";

        try {

            const url =
                "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
                + encodeURIComponent(place);

            const response = await fetch(url);
            const data = await response.json();

            if (!data.length) {
                message.innerText = "Destination not found.";
                return;
            }

            const destinationLat = Number(data[0].lat);
            const destinationLng = Number(data[0].lon);

            const routeUrl =
                "https://router.project-osrm.org/route/v1/driving/"
                + currentLng + "," + currentLat + ";"
                + destinationLng + "," + destinationLat
                + "?overview=full&geometries=geojson";

            const routeResponse = await fetch(routeUrl);
            const routeData = await routeResponse.json();

            if (routeData.code !== "Ok" || !routeData.routes.length) {
                message.innerText = "Route could not be found.";
                return;
            }

            const route = routeData.routes[0];

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }

            routeLayer = L.geoJSON(route.geometry, {
                style: {
                    color: "#2563eb",
                    weight: 6
                }
            }).addTo(map);

            L.marker([destinationLat, destinationLng])
                .addTo(map)
                .bindPopup("Your Destination");

            map.fitBounds(routeLayer.getBounds(), {
                padding: [30, 30]
            });

            const distance = (route.distance / 1000).toFixed(2);
            const minutes = Math.round(route.duration / 60);

            message.innerText =
                "Distance: " + distance +
                " km | Estimated driving time: " + minutes + " minutes";

        } catch (error) {
            message.innerText =
                "Could not find route. Please try again.";
        }
    }


    // Find nearby places
    async function findNearby(category) {

        if (currentLat === null) {
            message.innerText = "First click Find My Location.";
            return;
        }

        nearbyLayer.clearLayers();
        results.innerHTML = "";
        message.innerText = "Searching nearby places...";

        let filter = "";

        if (category === "petrol") {
            filter = 'node["amenity"="fuel"]';
        }

        if (category === "food") {
            filter = 'nwr["amenity"~"restaurant|cafe|fast_food"]';
        }

        if (category === "hotel") {
            filter = 'nwr["tourism"~"hotel|motel|guest_house"]';
        }

        if (category === "hospital") {
            filter = 'nwr["amenity"="hospital"]';
        }

        const query =
            '[out:json][timeout:20];(' +
            filter + '(around:5000,' +
            currentLat + ',' + currentLng +
            '););out center tags;';

        try {

            const response = await fetch(
                "https://overpass-api.de/api/interpreter",
                {
                    method: "POST",
                    body: query
                }
            );

            if (!response.ok) {
                throw new Error("Nearby search failed");
            }

            const data = await response.json();

            if (!data.elements.length) {
                message.innerText = "No nearby places found.";
                return;
            }

            let count = 0;

            data.elements.forEach(function(place) {

                const lat = place.lat ?? place.center?.lat;
                const lng = place.lon ?? place.center?.lon;

                if (lat === undefined || lng === undefined) {
                    return;
                }

                const name = place.tags?.name || "Unnamed place";

                L.marker([lat, lng])
                    .addTo(nearbyLayer)
                    .bindPopup(name);

                const item = document.createElement("div");
                item.className = "result";

                const title = document.createElement("b");
                title.textContent = name;

                const link = document.createElement("a");
                link.href =
                    "https://www.google.com/maps/dir/?api=1&destination="
                    + lat + "," + lng;

                link.target = "_blank";
                link.rel = "noopener";
                link.textContent = "Get Directions";

                item.appendChild(title);
                item.appendChild(document.createElement("br"));
                item.appendChild(link);

                results.appendChild(item);

                count++;
            });

            if (count === 0) {
                message.innerText = "No mapped places found.";
                return;
            }

            message.innerText =
                count + " nearby places found within approximately 5 km.";

        } catch (error) {
            message.innerText =
                "Nearby search is temporarily unavailable. Try again.";
        }
    }


    // Stop sharing
    async function stopSharing() {

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        try {

            const response = await fetch("/stop-sharing", {
                method: "POST"
            });

            const data = await response.json();

            message.innerText = data.message;

        } catch (error) {
            message.innerText = "Could not contact server.";
        }
    }

</script>

</body>
</html>
